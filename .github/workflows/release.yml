name: Release

on:
  push:
    tags: ['v*']
    
permissions:
  contents: write

jobs:
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: debian:bookworm
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    container: ${{ matrix.os }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y curl ca-certificates gcc libc6-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="browser4agent-${{ matrix.target }}"
          tar -C target/${{ matrix.target }}/release -czf "${name}.tar.gz" browser4agent
          sha256sum "${name}.tar.gz" | awk '{print $1}' > "${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: browser4agent-${{ matrix.target }}
          path: |
            browser4agent-${{ matrix.target }}.tar.gz
            browser4agent-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: ignore

  release:
    needs: [build-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/**/*
