name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: debian:bookworm
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    container: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="browser4agent-${{ matrix.target }}"
          tar -C target/${{ matrix.target }}/release -czf "${name}.tar.gz" browser4agent
          shasum -a 256 "${name}.tar.gz" | awk '{print $1}' > "${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: browser4agent-${{ matrix.target }}
          path: |
            browser4agent-${{ matrix.target }}.tar.gz
            browser4agent-${{ matrix.target }}.tar.gz.sha256
            browser4agent-${{ matrix.target }}.zip
            browser4agent-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Strip manifest key (Web Store rejects packages containing it)
        run: jq 'del(.key)' extension/manifest.json > extension/manifest.tmp && mv extension/manifest.tmp extension/manifest.json

      - name: Build extension
        run: cd extension && npx extension build --browser chrome,firefox --zip

      - name: Rename zips
        run: |
          mv extension/dist/firefox/*.zip extension/dist/firefox/extension-firefox.zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension-firefox-zip
          path: extension/dist/firefox/*.zip

  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cf
          packageManager: pnpm

  release:
    needs: [build-rust, build-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/**/*

  # 直接调用而不是依赖 release published 事件：
  # Release 是 GITHUB_TOKEN 发布的，其事件不会触发其它 workflow
  bump-packages:
    needs: [release]
    uses: ./.github/workflows/bump-packages.yml
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}

  publish-firefox:
    needs: build-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-firefox-zip

      - uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: ${{ secrets.FIREFOX_ADDON_GUID }}
          xpi-path: '*.zip'
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
