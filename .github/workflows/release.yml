name: Release

on:
  release:
    types: [published, prereleased]

permissions:
  contents: write

jobs:
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: debian:bookworm
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    container: ${{ matrix.os }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="browser4agent-${{ matrix.target }}"
          tar -C target/${{ matrix.target }}/release -czf "${name}.tar.gz" browser4agent
          shasum -a 256 "${name}.tar.gz" | awk '{print $1}' > "${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: browser4agent-${{ matrix.target }}
          path: |
            browser4agent-${{ matrix.target }}.tar.gz
            browser4agent-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: ignore

  release:
    needs: [build-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/**/*

  # 直接调用而不是依赖 release published 事件：
  # Release 是 GITHUB_TOKEN 发布的，其事件不会触发其它 workflow
  bump-packages:
    needs: [release]
    uses: ./.github/workflows/bump-packages.yml
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
